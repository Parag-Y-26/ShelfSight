[project]
name = "shelfsight-server"
version = "0.1.0"
description = "Local, authenticated retail observation server for ShelfSight"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20", "httpx>=0.28,<1", "google-genai>=1.0,<2", "opencv-contrib-python>=4.10,<5",
  "numpy>=1.26,<3", "mediapipe>=0.10.21,<0.11", "cryptography>=44", "qrcode[pil]>=8,<9", "tzdata>=2025"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11", "pip-audit>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelfsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 105
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]
