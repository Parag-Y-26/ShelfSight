name: Android verification and APK
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  android:
    # Exact golden references are generated and reviewed on Windows.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Restore dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze and test
        working-directory: app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Load private build configuration
        env:
          SUPABASE_CONFIG: ${{ secrets.SHELFSIGHT_SUPABASE_CONFIG }}
        run: |
          test -n "$SUPABASE_CONFIG" || { echo 'Configure SHELFSIGHT_SUPABASE_CONFIG before requesting an APK.'; exit 1; }
          printf '%s' "$SUPABASE_CONFIG" > config/local.json
          cp config/defaults.json app/assets/defaults.json
      - name: Build Android ARM64 demo
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi --dart-define-from-file=../config/local.json
      - name: Show public signing fingerprints for Google OAuth registration
        run: keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | grep -E 'SHA1:|SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: shelfsight-android-demo
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
