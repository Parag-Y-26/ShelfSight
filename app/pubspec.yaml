name: shelfsight
description: Privacy-conscious shelf monitoring and retail insights.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.7.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.9.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.2
  path: ^1.9.1
  crypto: ^3.0.6
  camera: ^0.11.2
  web_socket_channel: ^3.0.3
  google_mlkit_barcode_scanning: ^0.16.1
  image: ^4.5.4
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/logo.jpeg
    - assets/defaults.json
    - assets/l10n/
